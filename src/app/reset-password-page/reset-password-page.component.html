<div class="flex min-h-screen items-center justify-center bg-slate-950 px-4 py-8 text-slate-100 selection:bg-emerald-500 selection:text-slate-950">
  <div class="w-full max-w-md rounded-[2rem] border border-slate-800 bg-slate-900/80 p-6 shadow-2xl backdrop-blur-xl sm:p-8">
    <p class="text-xs font-semibold uppercase tracking-[0.35em] text-emerald-400">Reset Password</p>
    <h1 class="mt-4 text-3xl font-black tracking-tight text-slate-50">Choose a new password</h1>
    <p class="mt-3 text-sm leading-6 text-slate-400">
      Open this screen from the email reset link, then set a fresh password and continue back into the app.
    </p>

    <div *ngIf="errorMessage" class="mt-5 rounded-2xl border border-red-500/20 bg-red-500/10 px-4 py-3 text-sm text-red-300">
      {{ errorMessage }}
    </div>

    <div *ngIf="successMessage" class="mt-5 rounded-2xl border border-emerald-500/20 bg-emerald-500/10 px-4 py-3 text-sm text-emerald-300">
      {{ successMessage }}
    </div>

    <form (ngSubmit)="updatePassword()" class="mt-6 space-y-5">
      <div class="space-y-1.5">
        <label for="password" class="text-xs font-semibold uppercase tracking-[0.28em] text-slate-400">New Password</label>
        <input
          id="password"
          name="password"
          type="password"
          [(ngModel)]="password"
          [disabled]="loading"
          class="w-full rounded-2xl border border-slate-800 bg-slate-950 px-4 py-3 text-slate-100 outline-none transition focus:border-emerald-400 focus:ring-2 focus:ring-emerald-500/30"
          placeholder="At least 6 characters"
          required
        />
      </div>

      <div class="space-y-1.5">
        <label for="confirmPassword" class="text-xs font-semibold uppercase tracking-[0.28em] text-slate-400">Confirm Password</label>
        <input
          id="confirmPassword"
          name="confirmPassword"
          type="password"
          [(ngModel)]="confirmPassword"
          [disabled]="loading"
          class="w-full rounded-2xl border border-slate-800 bg-slate-950 px-4 py-3 text-slate-100 outline-none transition focus:border-emerald-400 focus:ring-2 focus:ring-emerald-500/30"
          placeholder="Repeat your new password"
          required
        />
      </div>

      <button
        type="submit"
        [disabled]="loading"
        class="inline-flex w-full items-center justify-center rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-400 px-4 py-3.5 text-sm font-bold text-slate-950 transition hover:from-emerald-400 hover:to-teal-300 disabled:opacity-50"
      >
        {{ loading ? 'Updating...' : 'Update Password' }}
      </button>
    </form>

    <div class="mt-6 text-center text-sm text-slate-400">
      Need to go back?
      <a routerLink="/login" class="ml-1 font-semibold text-emerald-400 transition hover:text-emerald-300">Return to login</a>
    </div>
  </div>
</div>
